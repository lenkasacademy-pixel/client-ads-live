<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ads Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --ink: #1d1d1b; --muted: #6f6e69; --line: #e6e4dd;
    --good: #1f8a4c; --warn: #b7791f; --bad: #c2362f; --idle: #9a9891; --accent: #c96442;
    --track: #ecebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a9891; --line: #2e2e2b;
      --good: #45b878; --warn: #e0a43c; --bad: #ef6a5f; --idle: #6f6e69; --accent: #e08a68; --track: #2a2a27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a9891; --line: #2e2e2b;
    --good: #45b878; --warn: #e0a43c; --bad: #ef6a5f; --idle: #6f6e69; --accent: #e08a68; --track: #2a2a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1640px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .stale { color: var(--warn); font-weight: 600; }
  .totals { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 120px; }
  .tile b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line)); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card.single { max-width: 640px; margin: 0 auto; width: 100%; }
  .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .head h2 { font-size: 17px; margin: 0; }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 0 0 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 5px 0; border-bottom: 1px solid var(--line); }
  td:first-child { color: var(--muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.today { font-weight: 600; }
  tr.result td:not(:first-child) { color: var(--good); }
  tr:last-child td { border-bottom: 0; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .camp { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 13px; }
  .camp .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .camp .n::before { content: "●"; color: var(--good); margin-right: 6px; font-size: 10px; }
  .camp.off .n::before { color: var(--idle); }
  .camp .v { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meter { margin-bottom: 10px; }
  .meter:last-child { margin-bottom: 0; }
  .meter .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .meter .top b { color: var(--c, var(--ink)); font-weight: 600; }
  .bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c, var(--idle)); border-radius: 99px; }
  .alert { font-size: 13px; padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .muted { color: var(--muted); }
  .err { color: var(--bad); font-size: 13px; }
  .center { text-align: center; padding: 80px 16px; color: var(--muted); }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  .share { display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .share a, .share button { flex: 1; text-align: center; font: inherit; font-size: 13px; font-weight: 600; padding: 7px 10px; border-radius: 8px; cursor: pointer; text-decoration: none; }
  .share a { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  .share button { background: none; color: var(--ink); border: 1px solid var(--line); }
  .share button.done { color: var(--good); border-color: var(--good); }
  /* Owner view: panels then a grid of compact cards */
  .panel { border: 1px solid var(--c); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; background: color-mix(in srgb, var(--c) 5%, var(--card)); }
  .panel h2 { font-size: 15px; margin: 0 0 6px; color: var(--c); }
  .panel h2.plain { color: var(--ink); }
  .item { padding: 2px 0; font-size: 14px; }
  .item .dot { color: var(--c); }
  .item b { font-weight: 600; }
  .item .t { color: var(--c); }
  .more { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 0 0; cursor: pointer; text-decoration: underline; }
  .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; }
  .mini { border: 1px solid var(--c); border-radius: 12px; padding: 10px 12px; background: var(--card); display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 14px; }
  .mini .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .mini .top b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .top span { color: var(--c); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .mini .r { display: flex; gap: 8px; align-items: center; white-space: nowrap; min-width: 0; }
  .mini .k { color: var(--muted); width: 62px; flex: none; overflow: hidden; text-overflow: ellipsis; }
  .mini .v { overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .mini .v strong { font-weight: 700; }
  .mini .g { color: var(--good); font-weight: 600; }
  .mini .mb { width: 64px; height: 14px; flex: none; background: repeating-linear-gradient(90deg, var(--track) 0 2px, transparent 2px 4px); border-radius: 2px; overflow: hidden; }
  .mini .mb i { display: block; height: 100%; background: var(--b); }
  .mini .mt { color: var(--b); overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .mini .al { color: var(--a); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .mini .links { display: flex; gap: 12px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12px; }
  .mini .links a, .mini .links button { color: var(--muted); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
  .mini .links a:hover, .mini .links button:hover { color: var(--accent); }
  .mini .links button.done { color: var(--good); }
  button.theme { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Loading…</div></div>
<script>
const REPO = 'lenkasacademy-pixel/client-ads-live';
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const slug = (params.get('c') || 'all').replace(/[^a-z0-9]/gi, '');
const keyText = new URLSearchParams(location.hash.slice(1)).get('k');
const isOwner = slug === 'all';

try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const rupees = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const num = n => Math.round(n || 0).toLocaleString('en-IN');
const C = { error: 'var(--bad)', warning: 'var(--warn)', success: 'var(--good)', idle: 'var(--idle)' };

function level(spend, limit) {
  if (!limit) return 'none';
  const u = spend / limit;
  return u >= 1 ? 'over' : u >= 0.85 ? 'near' : 'ok';
}
function capState(cap, perDay) {
  const left = Math.max(0, cap.limit - cap.spent);
  const days = perDay > 0 ? left / perDay : Infinity;
  const tone = left <= 0 || days < 2 ? 'over' : days < 5 || left / cap.limit < 0.1 ? 'near' : 'ok';
  return { left, days, tone };
}
function status(r) {
  const cap = r.cap ? capState(r.cap, r.yesterday?.spend || 0) : null;
  const daily = level(r.today?.spend || 0, r.limit);
  const issues = r.anomalies || [];
  if (r.error) return { text: 'NO DATA', c: C.warning, rank: 3 };
  if (cap && cap.left <= 0) return { text: 'LIMIT HIT', c: C.error, rank: 0 };
  if (cap?.tone === 'over') return { text: 'LIMIT RUNNING OUT', c: C.error, rank: 1 };
  if (issues.some(a => a.tone === 'error')) return { text: 'NEEDS ATTENTION', c: C.error, rank: 2 };
  if (daily === 'over') return { text: 'OVER DAILY BUDGET', c: C.error, rank: 2 };
  if (cap?.tone === 'near') return { text: 'LIMIT LOW', c: C.warning, rank: 3 };
  if (daily === 'near') return { text: 'NEAR DAILY BUDGET', c: C.warning, rank: 4 };
  if (issues.length) return { text: 'CHECK ALERTS', c: C.warning, rank: 4 };
  if (!(r.today?.spend) && !(r.yesterday?.spend)) return { text: 'IDLE', c: C.idle, rank: 6 };
  return { text: 'ON TRACK', c: C.success, rank: 5 };
}

function meter(label, used, c, text) {
  const pct = Math.max(0, Math.min(100, used * 100));
  return `<div class="meter" style="--c:${c}"><div class="top"><span>${label}</span><b>${esc(text)}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function card(r, single) {
  const st = status(r);
  const y = r.yesterday, t = r.today;
  if (r.error && !t) {
    return `<article class="card${single ? ' single' : ''}" style="--c:${st.c}"><div class="head"><h2>${esc(r.name)}</h2><span class="chip">${st.text}</span></div><div class="err">Couldn't load from Meta this time; it retries every 15 minutes.</div></article>`;
  }
  const labels = [...new Set([...(y?.results || []), ...(t?.results || [])].map(l => l.label))];
  const res = (d, l) => { const x = d?.results.find(v => v.label === l); return x ? `${num(x.count)} <span class="muted">@ ${rupees(x.spend / x.count)}</span>` : '0'; };
  const ctr = d => d?.impressions ? ((d.clicks / d.impressions) * 100).toFixed(2) + '%' : '—';
  const cpc = d => d?.clicks ? rupees(d.spend / d.clicks) : '—';
  const cpm = d => d?.impressions ? rupees(d.spend / d.impressions * 1000) : '—';
  const row = (name, a, b, cls = '') => `<tr class="${cls}"><td title="${esc(name)}">${esc(name)}</td><td>${a}</td><td class="today">${b}</td></tr>`;
  const running = (t?.campaigns || []);

  const spend = t?.spend || 0, lv = level(spend, r.limit);
  const daily = lv === 'none'
    ? meter('Daily budget', 0, C.idle, r.hasLifetime ? 'lifetime budget only' : 'no active daily budget')
    : meter('Daily budget', spend / r.limit, lv === 'over' ? C.error : lv === 'near' ? C.warning : C.success,
        `${Math.round(spend / r.limit * 100)}% of ${rupees(r.limit)}${r.hasLifetime ? ' + lifetime' : ''}`);
  let cap = meter('Account spending limit', 0, C.idle, 'no limit set');
  if (r.cap) {
    const s = capState(r.cap, y?.spend || 0);
    const days = Number.isFinite(s.days) ? ` · ~${s.days < 10 ? s.days.toFixed(1) : Math.round(s.days)} days` : '';
    cap = meter('Account spending limit', r.cap.spent / r.cap.limit, s.tone === 'over' ? C.error : s.tone === 'near' ? C.warning : C.success,
      `${rupees(s.left)} left of ${rupees(r.cap.limit)}${days}`);
  }
  const alerts = (r.anomalies || []).map(a => `<div class="alert" style="--c:${C[a.tone]}">▲ ${esc(a.text)}</div>`).join('');

  return `<article class="card${single ? ' single' : ''}" style="--c:${st.c}">
    <div class="head"><h2>${esc(r.name)}</h2><span class="chip">● ${st.text}</span></div>
    <table>
      <thead><tr><th></th><th>Yesterday</th><th>Today (live)</th></tr></thead>
      <tbody>
        ${row('Spend', rupees(y?.spend), rupees(t?.spend))}
        ${labels.length ? labels.map(l => row(l, res(y, l), res(t, l), 'result')).join('') : row('Results', '0', '0')}
        ${row('Impressions', num(y?.impressions), num(t?.impressions))}
        ${row('Link clicks', num(y?.clicks), num(t?.clicks))}
        ${row('CTR', ctr(y), ctr(t))}
        ${row('CPC', cpc(y), cpc(t))}
        ${row('CPM', cpm(y), cpm(t))}
      </tbody>
    </table>
    ${historyTable(r)}
    ${alerts ? `<div class="section"><h3>Alerts</h3>${alerts}</div>` : ''}
    <div class="section"><h3>Running today</h3>
      ${running.length ? running.slice(0, 6).map(c => `<div class="camp ${c.status === 'ACTIVE' ? '' : 'off'}"><span class="n" title="${esc(c.name)}">${esc(c.name)}</span><span class="v">${rupees(c.spend)}${c.results ? ' · ' + num(c.results) : ''}</span></div>`).join('') : '<div class="muted">Nothing spending yet today</div>'}
      ${running.length > 6 ? `<div class="muted">+${running.length - 6} more</div>` : ''}
    </div>
    <div class="section">${daily}${cap}</div>
    ${isOwner && r.key ? `<div class="share">
      <a href="${esc(clientLink(r))}" target="_blank" rel="noopener">Open client page ↗</a>
      <button type="button" data-copy="${esc(clientLink(r))}">Copy client link</button>
    </div>` : ''}
  </article>`;
}

function historyTable(r) {
  const days = r.history || [];
  if (!days.length) return '';
  const label = [...new Set(days.flatMap(d => Object.keys(d.results)))][0];
  const when = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const rows = [...days].reverse().map(d => {
    const n = label ? (d.results[label] || 0) : 0;
    return `<tr><td>${when(d.date)}</td><td>${rupees(d.spend)}</td><td>${num(d.clicks)}</td><td>${label ? num(n) : '—'}</td><td>${n ? rupees(d.spend / n) : '—'}</td></tr>`;
  }).join('');
  const sum = k => days.reduce((a, d) => a + d[k], 0);
  const total = label ? days.reduce((a, d) => a + (d.results[label] || 0), 0) : 0;
  return `<div class="section"><h3>Last 10 days${label ? ' · ' + esc(short(label)) : ''}</h3>
    <table class="hist"><thead><tr><th>Day</th><th>Spend</th><th>Clicks</th><th>${label ? esc(short(label)) : 'Results'}</th><th>Cost each</th></tr></thead>
    <tbody>${rows}<tr class="result"><td>Total</td><td>${rupees(sum('spend'))}</td><td>${num(sum('clicks'))}</td><td>${num(total)}</td><td>${total ? rupees(sum('spend') / total) : '—'}</td></tr></tbody></table></div>`;
}

function clientLink(r) {
  return `${location.origin}${location.pathname}?c=${encodeURIComponent(r.slug)}#k=${r.key}`;
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-copy]');
  if (!btn) return;
  const text = btn.dataset.copy;
  try { await navigator.clipboard.writeText(text); }
  catch (err) { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  btn.textContent = 'Copied ✓'; btn.classList.add('done');
  setTimeout(() => { btn.textContent = 'Copy client link'; btn.classList.remove('done'); }, 2000);
});

async function decrypt(text, keyB64) {
  const b64 = keyB64.replace(/-/g, '+').replace(/_/g, '/');
  const raw = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), ch => ch.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const data = Uint8Array.from(atob(text.trim()), ch => ch.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ── Owner view: alerts, sales, hourly, compact cards ─────────────────────
const SHORT = {
  'Phone calls placed': 'Calls', 'In-app registrations completed': 'Sign-ups', 'Website purchases': 'Sales',
  'Purchases': 'Sales', 'Messaging conversations started': 'Chats', 'Leads': 'Leads', 'Website leads': 'Leads',
};
const short = l => SHORT[l] || l;
const isSale = l => /purchase/i.test(l || '');
const daysText = d => d < 1 ? `~${Math.max(1, Math.round(d * 24))} h` : `~${d.toFixed(1)} days`;

function ownerStatus(r) {
  const cap = r.cap ? capState(r.cap, r.yesterday?.spend || 0) : null;
  const daily = level(r.today?.spend || 0, r.limit);
  const issues = r.anomalies || [];
  if (r.error) return { text: 'NO DATA', c: C.warning, rank: 3 };
  if (cap && cap.left <= 0) return { text: 'LIMIT HIT', c: C.error, rank: 0 };
  if (cap?.tone === 'over') return { text: 'RUNNING OUT', c: C.error, rank: 1 };
  if (daily === 'over' || issues.some(a => a.tone === 'error')) return { text: 'ATTENTION', c: C.error, rank: 2 };
  if (cap?.tone === 'near') return { text: 'LIMIT LOW', c: C.warning, rank: 3 };
  if (daily === 'near' || issues.length) return { text: 'CHECK', c: C.warning, rank: 4 };
  if (!(r.today?.spend) && !(r.yesterday?.spend)) return { text: 'IDLE', c: C.idle, rank: 6 };
  return { text: 'ON TRACK', c: C.success, rank: 5 };
}

/** Every alert worth reading, red first: spending limit, daily budget, then the anomaly checks. */
function alertsOf(r) {
  const out = [];
  if (r.cap) {
    const c = capState(r.cap, r.yesterday?.spend || 0);
    if (c.left <= 0) out.push({ tone: 'error', text: 'Spending limit hit: ads have stopped' });
    else if (c.tone === 'over') out.push({ tone: 'error', text: `Spending limit runs out in ${daysText(c.days)} (${rupees(c.left)} left)` });
    else if (c.tone === 'near') out.push({ tone: 'warning', text: `Spending limit low: ${rupees(c.left)} left${Number.isFinite(c.days) ? `, out in ${daysText(c.days)}` : ''}` });
  }
  const spend = r.today?.spend || 0, lv = level(spend, r.limit);
  if (lv === 'over') out.push({ tone: 'error', text: `Over daily budget: ${rupees(spend)} of ${rupees(r.limit)}` });
  else if (lv === 'near') out.push({ tone: 'warning', text: `Near daily budget: ${Math.round(spend / r.limit * 100)}% of ${rupees(r.limit)}` });
  for (const a of r.anomalies || []) out.push(a);
  return out;
}

function miniBar(used, color, text) {
  const pct = Math.max(0, Math.min(100, used * 100));
  return `<span class="mb" style="--b:${color}"><i style="width:${pct}%"></i></span><span class="mt" style="--b:${color}">${esc(text)}</span>`;
}

function mini(r) {
  const st = ownerStatus(r), y = r.yesterday, t = r.today;
  const all = [...(y?.results || []), ...(t?.results || [])];
  const top = all.sort((a, b) => b.count - a.count)[0]?.label;
  const cnt = (d, l) => d?.results.find(x => x.label === l);
  const tl = top ? cnt(t, top) : null;
  const res = top
    ? `<div class="r"><span class="k">${esc(short(top))}</span><span class="v">${num(cnt(y, top)?.count)} → <span class="g">${num(tl?.count)}</span>${tl ? ` @ ${rupees(tl.spend / tl.count)}` : ''}</span></div>`
    : `<div class="r"><span class="k">Results</span><span class="v">0 → <span class="g">0</span></span></div>`;
  const spend = t?.spend || 0, lv = level(spend, r.limit);
  const daily = lv === 'none'
    ? miniBar(0, C.idle, r.hasLifetime ? 'lifetime budget only' : 'no active daily budget')
    : miniBar(spend / r.limit, lv === 'over' ? C.error : lv === 'near' ? C.warning : C.success,
        `${Math.round(spend / r.limit * 100)}% of ${rupees(r.limit)}${r.hasLifetime ? ' +LT' : ''}`);
  let cap = miniBar(0, C.idle, 'no limit set');
  if (r.cap) {
    const c = capState(r.cap, y?.spend || 0);
    cap = miniBar(r.cap.spent / r.cap.limit, c.tone === 'over' ? C.error : c.tone === 'near' ? C.warning : C.success,
      `${rupees(c.left)} left${Number.isFinite(c.days) ? ` · ~${c.days < 10 ? c.days.toFixed(1) : Math.round(c.days)}d` : ''}`);
  }
  const first = alertsOf(r)[0];
  return `<article class="mini" style="--c:${st.c}">
    <div class="top"><b title="${esc(r.name)}">${esc(r.name)}</b><span>● ${st.text}</span></div>
    ${r.error && !t ? `<div class="err">Couldn't load from Meta; retrying every 15 min.</div>` : `
    <div class="r"><span class="k">Spend</span><span class="v">${rupees(y?.spend)} → <strong>${rupees(t?.spend)}</strong></span></div>
    ${res}
    <div class="r"><span class="k">Daily</span>${daily}</div>
    <div class="r"><span class="k">Limit</span>${cap}</div>`}
    ${first ? `<div class="al" style="--a:${C[first.tone]}" title="${esc(first.text)}">▲ ${esc(first.text)}</div>` : ''}
    ${r.key ? `<div class="links"><a href="${esc(clientLink(r))}" target="_blank" rel="noopener">Open client page ↗</a><button type="button" data-copy="${esc(clientLink(r))}">Copy client link</button></div>` : ''}
  </article>`;
}

let showAllAlerts = false;
function renderOwner(doc) {
  const list = [...doc.clients].sort((a, b) => ownerStatus(a).rank - ownerStatus(b).rank ||
    ((b.today?.spend || 0) + (b.yesterday?.spend || 0)) - ((a.today?.spend || 0) + (a.yesterday?.spend || 0)));
  const gen = new Date(doc.generatedAt);
  const ageMin = (Date.now() - gen) / 60000;
  const ist = d => new Date(d).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false });
  const when = gen.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
  const sum = k => list.reduce((s, r) => s + (r[k]?.spend || 0), 0);
  document.title = 'Ads Live';

  // Alerts: red first, then amber.
  const alerts = list.flatMap(r => alertsOf(r).map(a => ({ ...a, name: r.name })))
    .sort((a, b) => (a.tone === 'error' ? 0 : 1) - (b.tone === 'error' ? 0 : 1));
  const shown = showAllAlerts ? alerts : alerts.slice(0, 5);
  const alertPanel = alerts.length ? `<section class="panel" style="--c:${C.error}">
    <h2>🔔 Alerts · ${alerts.length}</h2>
    ${shown.map(a => `<div class="item" style="--c:${C[a.tone]}"><span class="dot">●</span> <b>${esc(a.name)}</b> · <span class="t">${esc(a.text)}</span></div>`).join('')}
    ${alerts.length > 5 ? `<button class="more" id="more">${showAllAlerts ? 'Show fewer' : `+${alerts.length - 5} more: show all`}</button>` : ''}
  </section>` : `<section class="panel" style="--c:${C.success}"><h2>✓ No alerts</h2><div class="item">Every client is within budget and limit.</div></section>`;

  // Sales: clients whose results are purchases.
  const salesClients = list.filter(r => [...(r.today?.results || []), ...(r.yesterday?.results || [])].some(l => isSale(l.label)));
  const salesToday = r => (r.today?.results || []).filter(l => isSale(l.label)).reduce((s, l) => s + l.count, 0);
  const newSales = (doc.hourly?.rows || []).reduce((s, row) => s + row.gains.filter(g => isSale(g.label)).reduce((x, g) => x + g.count, 0), 0);
  const salesPanel = salesClients.length ? `<section class="panel" style="--c:${C.success}">
    <h2>🎉 Sales today · ${salesClients.reduce((s, r) => s + salesToday(r), 0)}${doc.hourly?.from ? ` <span class="muted" style="font-weight:400">(${newSales} new in the last hour)</span>` : ''}</h2>
    ${salesClients.map(r => `<div class="item" style="--c:${C.success}"><span class="dot">●</span> <b>${esc(r.name)}</b> <span class="t">${num(salesToday(r))} sale${salesToday(r) === 1 ? '' : 's'}</span> · ${rupees(r.today?.spend)} spent</div>`).join('')}
  </section>` : '';

  // Hourly: what changed since about an hour ago.
  let hourPanel = '';
  const h = doc.hourly;
  if (h) {
    const rows = h.rows || [];
    const active = rows.filter(x => x.gains.length || x.spent > 0.5)
      .sort((a, b) => (b.gains.length ? 1 : 0) - (a.gains.length ? 1 : 0) || b.spent - a.spent);
    const quiet = rows.filter(x => !active.includes(x)).map(x => x.name);
    hourPanel = `<section class="panel" style="--c:var(--line)">
      <h2 class="plain">⏱ Hourly · ${h.from ? `${ist(h.from)} → ${ist(h.to)} IST` : 'starts after the next refresh'}</h2>
      ${h.from ? active.map(x => `<div class="item" style="--c:${x.gains.length ? C.success : C.warning}"><span class="dot">●</span> <b>${esc(x.name)}</b> ${x.gains.length
          ? x.gains.map(g => `<span class="g" style="color:var(--good)">+${num(g.count)} ${esc(short(g.label).toLowerCase())}</span>`).join(', ')
          : '<span class="t">no results</span>'} · ${rupees(x.spent)} spent</div>`).join('') : ''}
      ${h.from && quiet.length ? `<div class="item muted">Quiet: ${quiet.map(esc).join(', ')}</div>` : ''}
    </section>`;
  }

  app.innerHTML = `
    <header>
      <div>
        <h1>Client ads · live</h1>
        <div class="sub">Updated ${when} IST · refreshes every 15 min${ageMin > 45 ? ` · <span class="stale">last update ${Math.round(ageMin)} min ago</span>` : ''}</div>
      </div>
      <div class="totals">
        <div class="tile"><span>Today</span><b>${rupees(sum('today'))}</b></div>
        <div class="tile"><span>Yesterday</span><b>${rupees(sum('yesterday'))}</b></div>
        <div class="tile"><span>Clients</span><b>${list.length}</b></div>
      </div>
    </header>
    ${alertPanel}${salesPanel}${hourPanel}
    <div class="mini-grid">${list.map(mini).join('')}</div>
    <footer>Numbers from Meta Ads; "today" can lag Meta by 15–30 min. <button class="theme" id="theme">Light / dark</button></footer>`;
  const more = document.getElementById('more');
  if (more) more.onclick = () => { showAllAlerts = !showAllAlerts; renderOwner(doc); };
  bindTheme();
}

function bindTheme() {
  document.getElementById('theme').onclick = () => {
    const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#161614';
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  };
}

function render(doc) {
  if (isOwner) return renderOwner(doc);
  const list = [...doc.clients].sort((a, b) => status(a).rank - status(b).rank ||
    ((b.today?.spend || 0) + (b.yesterday?.spend || 0)) - ((a.today?.spend || 0) + (a.yesterday?.spend || 0)));
  const gen = new Date(doc.generatedAt);
  const ageMin = (Date.now() - gen) / 60000;
  const when = gen.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
  const sum = k => list.reduce((s, r) => s + (r[k]?.spend || 0), 0);
  const alertCount = list.filter(r => status(r).rank <= 3).length;
  const title = isOwner ? 'Client ads · live' : `${list[0]?.name || 'Ads'} · live ads report`;
  document.title = isOwner ? 'Ads Live' : `${list[0]?.name || 'Ads'} Ads Live`;

  app.innerHTML = `
    <header>
      <div>
        <h1>${esc(title)}</h1>
        <div class="sub">Updated ${when} IST · refreshes every 15 min${ageMin > 45 ? ` · <span class="stale">last update ${Math.round(ageMin)} min ago</span>` : ''}</div>
      </div>
      ${isOwner ? `<div class="totals">
        <div class="tile"><span>Today</span><b>${rupees(sum('today'))}</b></div>
        <div class="tile"><span>Yesterday</span><b>${rupees(sum('yesterday'))}</b></div>
        <div class="tile"><span>Need attention</span><b style="color:${alertCount ? 'var(--bad)' : 'var(--good)'}">${alertCount}</b></div>
        <div class="tile"><span>Clients</span><b>${list.length}</b></div>
      </div>` : ''}
    </header>
    <div class="${isOwner ? 'grid' : ''}">${list.map(r => card(r, !isOwner)).join('')}</div>
    <footer>Numbers from Meta Ads; "today" can lag Meta by 15–30 min. <button class="theme" id="theme">Light / dark</button></footer>`;
  document.getElementById('theme').onclick = () => {
    const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#161614';
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  };
}

// GitHub's API always has the newest copy; the raw-file server can lag ~5 min, so it is only the fallback.
async function latest() {
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${slug}.enc?ref=data`, {
      headers: { Accept: 'application/vnd.github.raw' }, cache: 'no-store',
    });
    if (res.ok) return await res.text();
  } catch (e) {}
  const res = await fetch(`https://raw.githubusercontent.com/${REPO}/data/${slug}.enc?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('not found');
  return res.text();
}

async function load() {
  if (!keyText) { app.innerHTML = '<div class="center">This link is missing its key. Ask for the full link.</div>'; return; }
  try {
    render(await decrypt(await latest(), keyText));
  } catch (e) {
    if (!app.querySelector('.card')) app.innerHTML = '<div class="center">Couldn’t open this report. Check that you have the full link.</div>';
  }
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
