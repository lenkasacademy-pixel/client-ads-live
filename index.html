<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ads Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --ink: #1d1d1b; --muted: #6f6e69; --line: #e6e4dd;
    --good: #1f8a4c; --warn: #b7791f; --bad: #c2362f; --idle: #9a9891; --accent: #c96442;
    --track: #ecebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a9891; --line: #2e2e2b;
      --good: #45b878; --warn: #e0a43c; --bad: #ef6a5f; --idle: #6f6e69; --accent: #e08a68; --track: #2a2a27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a9891; --line: #2e2e2b;
    --good: #45b878; --warn: #e0a43c; --bad: #ef6a5f; --idle: #6f6e69; --accent: #e08a68; --track: #2a2a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .stale { color: var(--warn); font-weight: 600; }
  .totals { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 120px; }
  .tile b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line)); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card.single { max-width: 640px; margin: 0 auto; width: 100%; }
  .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .head h2 { font-size: 17px; margin: 0; }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 600; color: var(--muted); font-size: 12px; padding: 0 0 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 5px 0; border-bottom: 1px solid var(--line); }
  td:first-child { color: var(--muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.today { font-weight: 600; }
  tr.result td:not(:first-child) { color: var(--good); }
  tr:last-child td { border-bottom: 0; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .camp { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 13px; }
  .camp .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .camp .n::before { content: "●"; color: var(--good); margin-right: 6px; font-size: 10px; }
  .camp.off .n::before { color: var(--idle); }
  .camp .v { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meter { margin-bottom: 10px; }
  .meter:last-child { margin-bottom: 0; }
  .meter .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .meter .top b { color: var(--c, var(--ink)); font-weight: 600; }
  .bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c, var(--idle)); border-radius: 99px; }
  .alert { font-size: 13px; padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .muted { color: var(--muted); }
  .err { color: var(--bad); font-size: 13px; }
  .center { text-align: center; padding: 80px 16px; color: var(--muted); }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
  button.theme { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Loading…</div></div>
<script>
const REPO = 'lenkasacademy-pixel/client-ads-live';
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const slug = (params.get('c') || 'all').replace(/[^a-z0-9]/gi, '');
const keyText = new URLSearchParams(location.hash.slice(1)).get('k');
const isOwner = slug === 'all';

try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const rupees = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const num = n => Math.round(n || 0).toLocaleString('en-IN');
const C = { error: 'var(--bad)', warning: 'var(--warn)', success: 'var(--good)', idle: 'var(--idle)' };

function level(spend, limit) {
  if (!limit) return 'none';
  const u = spend / limit;
  return u >= 1 ? 'over' : u >= 0.85 ? 'near' : 'ok';
}
function capState(cap, perDay) {
  const left = Math.max(0, cap.limit - cap.spent);
  const days = perDay > 0 ? left / perDay : Infinity;
  const tone = left <= 0 || days < 2 ? 'over' : days < 5 || left / cap.limit < 0.1 ? 'near' : 'ok';
  return { left, days, tone };
}
function status(r) {
  const cap = r.cap ? capState(r.cap, r.yesterday?.spend || 0) : null;
  const daily = level(r.today?.spend || 0, r.limit);
  const issues = r.anomalies || [];
  if (r.error) return { text: 'NO DATA', c: C.warning, rank: 3 };
  if (cap && cap.left <= 0) return { text: 'LIMIT HIT', c: C.error, rank: 0 };
  if (cap?.tone === 'over') return { text: 'LIMIT RUNNING OUT', c: C.error, rank: 1 };
  if (issues.some(a => a.tone === 'error')) return { text: 'NEEDS ATTENTION', c: C.error, rank: 2 };
  if (daily === 'over') return { text: 'OVER DAILY BUDGET', c: C.error, rank: 2 };
  if (cap?.tone === 'near') return { text: 'LIMIT LOW', c: C.warning, rank: 3 };
  if (daily === 'near') return { text: 'NEAR DAILY BUDGET', c: C.warning, rank: 4 };
  if (issues.length) return { text: 'CHECK ALERTS', c: C.warning, rank: 4 };
  if (!(r.today?.spend) && !(r.yesterday?.spend)) return { text: 'IDLE', c: C.idle, rank: 6 };
  return { text: 'ON TRACK', c: C.success, rank: 5 };
}

function meter(label, used, c, text) {
  const pct = Math.max(0, Math.min(100, used * 100));
  return `<div class="meter" style="--c:${c}"><div class="top"><span>${label}</span><b>${esc(text)}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function card(r, single) {
  const st = status(r);
  const y = r.yesterday, t = r.today;
  if (r.error && !t) {
    return `<article class="card${single ? ' single' : ''}" style="--c:${st.c}"><div class="head"><h2>${esc(r.name)}</h2><span class="chip">${st.text}</span></div><div class="err">Couldn't load from Meta this time; it retries every 15 minutes.</div></article>`;
  }
  const labels = [...new Set([...(y?.results || []), ...(t?.results || [])].map(l => l.label))];
  const res = (d, l) => { const x = d?.results.find(v => v.label === l); return x ? `${num(x.count)} <span class="muted">@ ${rupees(x.spend / x.count)}</span>` : '0'; };
  const ctr = d => d?.impressions ? ((d.clicks / d.impressions) * 100).toFixed(2) + '%' : '—';
  const cpc = d => d?.clicks ? rupees(d.spend / d.clicks) : '—';
  const cpm = d => d?.impressions ? rupees(d.spend / d.impressions * 1000) : '—';
  const row = (name, a, b, cls = '') => `<tr class="${cls}"><td title="${esc(name)}">${esc(name)}</td><td>${a}</td><td class="today">${b}</td></tr>`;
  const running = (t?.campaigns || []);

  const spend = t?.spend || 0, lv = level(spend, r.limit);
  const daily = lv === 'none'
    ? meter('Daily budget', 0, C.idle, r.hasLifetime ? 'lifetime budget only' : 'no active daily budget')
    : meter('Daily budget', spend / r.limit, lv === 'over' ? C.error : lv === 'near' ? C.warning : C.success,
        `${Math.round(spend / r.limit * 100)}% of ${rupees(r.limit)}${r.hasLifetime ? ' + lifetime' : ''}`);
  let cap = meter('Account spending limit', 0, C.idle, 'no limit set');
  if (r.cap) {
    const s = capState(r.cap, y?.spend || 0);
    const days = Number.isFinite(s.days) ? ` · ~${s.days < 10 ? s.days.toFixed(1) : Math.round(s.days)} days` : '';
    cap = meter('Account spending limit', r.cap.spent / r.cap.limit, s.tone === 'over' ? C.error : s.tone === 'near' ? C.warning : C.success,
      `${rupees(s.left)} left of ${rupees(r.cap.limit)}${days}`);
  }
  const alerts = (r.anomalies || []).map(a => `<div class="alert" style="--c:${C[a.tone]}">▲ ${esc(a.text)}</div>`).join('');

  return `<article class="card${single ? ' single' : ''}" style="--c:${st.c}">
    <div class="head"><h2>${esc(r.name)}</h2><span class="chip">● ${st.text}</span></div>
    <table>
      <thead><tr><th></th><th>Yesterday</th><th>Today (live)</th></tr></thead>
      <tbody>
        ${row('Spend', rupees(y?.spend), rupees(t?.spend))}
        ${labels.length ? labels.map(l => row(l, res(y, l), res(t, l), 'result')).join('') : row('Results', '0', '0')}
        ${row('Impressions', num(y?.impressions), num(t?.impressions))}
        ${row('Link clicks', num(y?.clicks), num(t?.clicks))}
        ${row('CTR', ctr(y), ctr(t))}
        ${row('CPC', cpc(y), cpc(t))}
        ${row('CPM', cpm(y), cpm(t))}
      </tbody>
    </table>
    ${alerts ? `<div class="section"><h3>Alerts</h3>${alerts}</div>` : ''}
    <div class="section"><h3>Running today</h3>
      ${running.length ? running.slice(0, 6).map(c => `<div class="camp ${c.status === 'ACTIVE' ? '' : 'off'}"><span class="n" title="${esc(c.name)}">${esc(c.name)}</span><span class="v">${rupees(c.spend)}${c.results ? ' · ' + num(c.results) : ''}</span></div>`).join('') : '<div class="muted">Nothing spending yet today</div>'}
      ${running.length > 6 ? `<div class="muted">+${running.length - 6} more</div>` : ''}
    </div>
    <div class="section">${daily}${cap}</div>
  </article>`;
}

async function decrypt(text, keyB64) {
  const b64 = keyB64.replace(/-/g, '+').replace(/_/g, '/');
  const raw = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), ch => ch.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const data = Uint8Array.from(atob(text.trim()), ch => ch.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

function render(doc) {
  const list = [...doc.clients].sort((a, b) => status(a).rank - status(b).rank ||
    ((b.today?.spend || 0) + (b.yesterday?.spend || 0)) - ((a.today?.spend || 0) + (a.yesterday?.spend || 0)));
  const gen = new Date(doc.generatedAt);
  const ageMin = (Date.now() - gen) / 60000;
  const when = gen.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
  const sum = k => list.reduce((s, r) => s + (r[k]?.spend || 0), 0);
  const alertCount = list.filter(r => status(r).rank <= 3).length;
  const title = isOwner ? 'Client ads · live' : `${list[0]?.name || 'Ads'} · live ads report`;
  document.title = isOwner ? 'Ads Live' : `${list[0]?.name || 'Ads'} Ads Live`;

  app.innerHTML = `
    <header>
      <div>
        <h1>${esc(title)}</h1>
        <div class="sub">Updated ${when} IST · refreshes every 15 min${ageMin > 45 ? ` · <span class="stale">last update ${Math.round(ageMin)} min ago</span>` : ''}</div>
      </div>
      ${isOwner ? `<div class="totals">
        <div class="tile"><span>Today</span><b>${rupees(sum('today'))}</b></div>
        <div class="tile"><span>Yesterday</span><b>${rupees(sum('yesterday'))}</b></div>
        <div class="tile"><span>Need attention</span><b style="color:${alertCount ? 'var(--bad)' : 'var(--good)'}">${alertCount}</b></div>
        <div class="tile"><span>Clients</span><b>${list.length}</b></div>
      </div>` : ''}
    </header>
    <div class="${isOwner ? 'grid' : ''}">${list.map(r => card(r, !isOwner)).join('')}</div>
    <footer>Numbers from Meta Ads; "today" can lag Meta by 15–30 min. <button class="theme" id="theme">Light / dark</button></footer>`;
  document.getElementById('theme').onclick = () => {
    const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#161614';
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  };
}

async function load() {
  if (!keyText) { app.innerHTML = '<div class="center">This link is missing its key. Ask for the full link.</div>'; return; }
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${REPO}/data/${slug}.enc?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    render(await decrypt(await res.text(), keyText));
  } catch (e) {
    if (!app.querySelector('.card')) app.innerHTML = '<div class="center">Couldn’t open this report. Check that you have the full link.</div>';
  }
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
